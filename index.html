<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carbo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="img/carbo-logo.png" alt="Logo da Carbo" />
      </a>
      <div class="campo-busca">
        <input
          type="text"
          id="busca"
          placeholder="O que voce comeu hoje?"
          autocomplete="off"
        />
        <ul id="sugestoes"></ul>
      </div>
      <ul id="selecionados"></ul>
      <p id="totais" aria-live="polite" hidden>Total da refeicao: 0 g de carboidratos e 0 g de proteinas</p>
      <nav id="refeicoes" aria-label="Refeicoes" hidden>
        <button type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Zm13 2h2a2 2 0 0 1 0 4h-2M7 4c0 1 1 1 1 2M12 4c0 1 1 1 1 2" /></svg>
          <span>Cafe</span>
        </button>
        <button type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7m-3-7v4a3 3 0 0 0 6 0V3m-3 7v11m9-18v18m0-18a4 4 0 0 1 4 4v5h-4" /></svg>
          <span>Almoco</span>
        </button>
        <button type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" /><path d="M16 4v4m-2-2h4" /></svg>
          <span>Janta</span>
        </button>
        <button type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v2a8 8 0 0 1-16 0v-2Zm-1 0h18M7 6l2 2m3-4v4m3-2-2 2" /></svg>
          <span>Lanche</span>
        </button>
      </nav>
    </header>
    <footer>
      <a
        href="https://github.com/gabx2"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </footer>
    <script src="./alimentos.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
